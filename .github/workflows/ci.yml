name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    # Linux is the target the gate executes on; Windows is where one of us develops, and the
    # executor and the bash tests behave differently there (Git Bash path names, no execute bits).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Put Git Bash first on PATH
        # Windows runners can also have the WSL launcher as bash.exe; the tests need Git Bash.
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\Git\usr\bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        # pytest exits with 5 when no tests are collected; allow that while the repo is empty
        run: pytest || [ $? -eq 5 ]
