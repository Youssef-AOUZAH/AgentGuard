[project]
name = "agentguard"
version = "0.1.0"
description = "A compiler between AI coding agents and the shell"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["compiler/tests", "classifier/tests", "gate/tests", "bench/tests"]
